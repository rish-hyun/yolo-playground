services:
  vision:
    image: vision:latest
    container_name: vision
    build:
      context: services/vision
      additional_contexts:
        common: common
    environment:
      MODEL_VERSION: "yolo11n"
    ports:
      - "9500:8000"

  orchestrator:
    image: orchestrator:latest
    container_name: orchestrator
    build:
      context: services/orchestrator
      additional_contexts:
        common: common
    environment:
      VISION_SERVICE_HOST: vision
      VISION_SERVICE_PORT: 8000
    ports:
      - "9600:8000"

  frontend:
    image: frontend:latest
    container_name: frontend
    build:
      context: services/frontend
      additional_contexts:
        common: common
    environment:
      ORCHESTRATOR_SERVICE_HOST: orchestrator
      ORCHESTRATOR_SERVICE_PORT: 8000
    ports:
      - "9700:8000"
